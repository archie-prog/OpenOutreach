<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Grantgunner</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #0f172a; }
    .card { background: #fff; width: 100%; max-width: 380px; border-radius: 16px; padding: 34px 30px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    .brand { font-weight: 800; font-size: 24px; letter-spacing: -.02em; text-align: center; margin-bottom: 4px; }
    .brand .dot { color: #2563eb; }
    .sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #334155; margin: 14px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 11px 13px; border: 1px solid #d1d5db; border-radius: 9px; font-size: 15px; }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    button { width: 100%; margin-top: 22px; padding: 12px; background: #2563eb; color: #fff; border: none;
             border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    .foot { text-align: center; margin-top: 18px; font-size: 13px; }
    .foot a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Grantgunner<span class="dot">.</span></div>
    <div class="sub">Sign in to your outreach workspace</div>

    {% if form.errors %}
      <div class="err">That username and password didn't match. Please try again.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required>
      <label for="id_password">Password</label>
      <input id="id_password" type="password" name="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>

    <div class="foot"><a href="/">← Back to home</a></div>
  </div>
</body>
</html>
